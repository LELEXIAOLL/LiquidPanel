plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'LiquidPanel'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.21.11-R0.1-SNAPSHOT")

    // gson 由服务端自带，插件不需要打包
    compileOnly("com.google.code.gson:gson:2.11.0")

    // 控制台日志要拿到颜色，必须在 log4j 剥离之前挂 appender，
    // 所以直接引用 log4j-core。服务端自带，用 compileOnly 不打进插件。
    compileOnly("org.apache.logging.log4j:log4j-core:2.24.1")

    // 网页面板：HTTP + WebSocket。会随插件一起打包，见下面的 jar 配置。
    implementation("io.undertow:undertow-core:2.3.18.Final")
}

tasks {
    runServer {
        // 只跑最新版本即可，本插件不含多版本适配
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// 把运行时依赖直接展开进插件 jar，不使用 shadow 插件。
//
// EXCLUDE 是必须的：依赖之间如果有同名条目，重复写入会产生损坏的 zip。
// 已确认本插件的依赖不存在重复的 META-INF/services（XnioProvider 只有 xnio-nio 提供），
// 所以 EXCLUDE 不会丢掉任何必需的 SPI 声明。
//
// 签名文件必须排除：依赖若是签过名的，重新打包后摘要对不上，
// 加载时会直接抛 SecurityException。
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    exclude(
            'META-INF/*.SF',
            'META-INF/*.DSA',
            'META-INF/*.RSA',
            'META-INF/MANIFEST.MF',
            'module-info.class'
    )
}
