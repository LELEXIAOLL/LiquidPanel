plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'LiquidPanel'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.21.11-R0.1-SNAPSHOT")

    // gson 由服务端自带，插件不需要打包
    compileOnly("com.google.code.gson:gson:2.11.0")

    // 控制台日志要拿到颜色，必须在 log4j 剥离之前挂 appender，
    // 所以直接引用 log4j-core。服务端自带，用 compileOnly 不打进插件。
    compileOnly("org.apache.logging.log4j:log4j-core:2.24.1")

    // Vault 经济 API。只在编译期用，不打进 jar —— 运行期由服务端上装的 Vault 插件提供。
    //
    // 不用 Maven 坐标：VaultAPI 只发布在 JitPack 上，国内拉取不稳，
    // 直接引用仓库里这份 jar。Vault 的 Economy 接口多年未变，拿哪一版编译都一样。
    //
    // 红线：不要在源码里自己写一个 net.milkbowl.vault.economy.Economy。
    // Bukkit 的插件类加载器是「先查自己的 jar」，同名类会把 Vault 那份遮住，
    // 于是 Vault 的实现类实现的就成了另一个接口，instanceof 与转型全部失效。
    compileOnly(files("other/Vault.jar"))

    // 网页面板：HTTP + WebSocket。会随插件一起打包，见下面的 jar 配置。
    implementation("io.undertow:undertow-core:2.3.18.Final")

    // 7z 压缩与解压。JDK 完全没有 7z 支持，zip 仍用 JDK 自带的 java.util.zip。
    implementation("org.apache.commons:commons-compress:1.27.1")
    implementation("org.tukaani:xz:1.9")

    // 临时封禁记录的 SQLite 存储。驱动里含 23 个平台的本地库，整包约 12.9MB，
    // 其中真正的 Java 代码不到 1MB —— 剩下的都是各个 Linux / Windows / macOS 架构的
    // sqlitejdbc 二进制。选了 json 存储的话这个包不会被加载，但也没法从 jar 里省掉。
    //
    // 不能排除它传递引入的 slf4j-api：sqlite-jdbc 的 JDBC、SQLiteJDBCLoader、NativeDB、
    // OSInfo、JDBC3DatabaseMetaData 等 9 个类直接引用了 org.slf4j，而且都在核心路径上，
    // 排掉会 NoClassDefFoundError。slf4j-api 自身只有 40KB 且不带 SPI 声明，没有副作用。
    implementation("org.xerial:sqlite-jdbc:3.45.3.0")
}

tasks {
    runServer {
        // 只跑最新版本即可，本插件不含多版本适配
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// 把运行时依赖直接展开进插件 jar，不使用 shadow 插件。
//
// EXCLUDE 是必须的：依赖之间如果有同名条目，重复写入会产生损坏的 zip。
// 已确认本插件的依赖不存在重复的 META-INF/services（XnioProvider 只有 xnio-nio 提供），
// 所以 EXCLUDE 不会丢掉任何必需的 SPI 声明。
//
// 签名文件必须排除：依赖若是签过名的，重新打包后摘要对不上，
// 加载时会直接抛 SecurityException。
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    exclude(
            'META-INF/*.SF',
            'META-INF/*.DSA',
            'META-INF/*.RSA',
            'META-INF/MANIFEST.MF',
            'module-info.class'
    )
}
