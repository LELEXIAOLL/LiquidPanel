# ==========================================================
#  LiquidPanel 配置文件
#  修改后使用 /liquidpanel reload 重新载入
#
#  注意：插件会以本文件为模板校验服务端上的同名文件，
#  缺失配置项或类型写错时，会自动把原文件备份为 config.yml.bak
#  并重新释放本文件。所以请勿随意删除下面的配置项。
# ==========================================================

# 语言代码，对应插件目录下的 messages_<language>.yml
# 例如 zhcn -> messages_zhcn.yml
language: zhcn

# 服务器启动时是否自动打开面板
auto_open_panel: true

# ==========================================================
#  网页面板
# ==========================================================
panel:

  # 是否随插件启动。关闭后 /ldp openpanel 也会拒绝执行
  enabled: true

  # 监听端口
  port: 1357

  # 监听地址。0.0.0.0 表示所有网卡都能访问（外网/局域网可连）
  # 只想本机访问就改成 127.0.0.1
  host: "0.0.0.0"

  # 登录状态闲置多久后失效（分钟）
  session_timeout_minutes: 120

  # 是否把登录状态与来源 IP 绑定。
  # 开启更安全，但换网络（手机流量切 WiFi）会导致需要重新登录。
  bind_session_ip: false

  # 允许访问面板的域名白名单。
  #
  # 回环地址（127.0.0.1 / localhost / ::1）和本机所有网卡 IP 都已自动允许，
  # 这里只需要补「通过域名访问面板」时用到的域名，例如：
  #   allowed_hosts:
  #     - panel.example.com
  #
  # 不填的话用域名访问会被同源校验拒绝（登录接口返回 403），
  # 届时控制台会打印一条带该域名的提醒。
  # 这道白名单是防 DNS Rebinding 的：攻击者把域名解析到面板 IP 后，
  # Origin 与 Host 都由他控制且天然相等，只比较这两个值拦不住。
  allowed_hosts: []

  # ==========================================================
  #  数据存储
  #  改完需要重启服务端，reload 不重建存储
  # ==========================================================
  database:

    # 面板自己的数据存哪。有两份：
    #   封禁记录 —— 谁、什么时候、因为什么封的，以及临时封禁什么时候到期（到期解封靠它）
    #   玩家名册 —— 见过哪些玩家、最后什么时候在线（列出「所有玩家/离线玩家」靠它）
    #
    #   json   —— 插件目录下的 bans.json 和 players.json，
    #             纯文本，可以直接打开看、手动改
    #   sqlite —— 插件目录下的 panel.db，两份数据各占一张表；
    #             驱动已随插件打包，不需要额外装东西
    #
    # 两份数据的量都不大（封禁几条到几百条，名册几千条），
    # 差别在写入方式而非容量：json 每次变更是整份重写，sqlite 是行级写入。
    # 单人管理用 json 完全够，多人同时操作面板、或者玩家很多时再换 sqlite。
    type: json

  # ==========================================================
  #  防密码爆破
  #  改完执行 /liquidpanel reload 立即生效，不用重启
  # ==========================================================
  security:

    # 统计窗口内允许的失败次数，达到就封禁
    # 调小更严格；调成很大的值等于关闭封禁
    max_failures: 5

    # 失败次数统计窗口（分钟）。超过这个时长的旧失败记录会被清零重算
    fail_window_minutes: 5

    # 触发后封禁多久（分钟）。期间该来源的登录与改密码请求一律 429
    block_minutes: 10

    # 同时进行的密码校验上限。
    # 每次校验要跑约 400ms 的 PBKDF2，这是防止有人用海量登录请求打满 CPU 的闸门。
    # 正常管理面板一两个人用，4 个足够；被刷时超出的请求立刻 429，不排队、不占线程。
    max_concurrent_verifications: 4
